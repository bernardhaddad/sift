name: insider radar trace
# site requests come through the relay (relay/worker.js), which finds its run by this name
run-name: ${{ github.event_name == 'workflow_dispatch' && format('trace {0} {1}', inputs.mint, inputs.requester) || github.event.issue.title }}

# answers "[trace] <mint>" issues with a holder trace (scripts/trace_token.py in the private repo),
# saves it to radar-requests/ and replies on the issue. workflow_dispatch = same thing by hand.
# issue text only reaches the job through env vars; the mint is checked as base58 before use.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mint:
        description: Token mint address
        required: true
      issue:
        description: Issue number to answer (optional, for re-running a missed request)
        required: false
      requester:
        description: Opaque requester id from the site relay (it applies the daily limits)
        required: false

permissions:
  actions: read   # the daily count of relay requests
  contents: write
  issues: write

# one group per issue request and per relay run. Relay runs do not share a group: a newer waiting
# run would cancel another visitor's waiting one. The relay keeps them to MAX_ACTIVE at once and
# cancels its own run when a burst went past a limit; "Read the request" refuses one it missed.
concurrency:
  group: radar-trace-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  SOURCE_REF: 129c14be0cc76d739ec2e71edcfd3caf13323079  # private code commit
  DAILY_LIMIT: "40"      # fresh traces a day, issue and relay requests together
  PER_USER_LIMIT: "3"    # requests a day per GitHub account or relay visitor
  MAX_ACTIVE: "2"        # relay traces queued or running at once (same as relay/worker.js)

jobs:
  trace:
    # match the form heading too, in case the title was edited
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[trace]') ||
      contains(github.event.issue.body, '### Token mint address')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout this site repository
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false

      - name: Read the request
        id: req
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_MINT: ${{ github.event.inputs.mint }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
          REQUESTER: ${{ github.event.inputs.requester }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          rx = re.compile(r"(?<![1-9A-HJ-NP-Za-km-z])[1-9A-HJ-NP-Za-km-z]{32,44}(?![1-9A-HJ-NP-Za-km-z])")
          text = "\n".join(os.environ.get(k, "") for k in ("INPUT_MINT", "ISSUE_TITLE", "ISSUE_BODY"))
          m = rx.search(text)
          mint = m.group(0) if m else ""
          status = "ok" if mint else "invalid"
          # cached: a trace of this mint in the last 2 hours is reused
          p = f"site/radar-requests/{mint}.json"
          if mint and os.path.exists(p):
              try:
                  at = datetime.fromisoformat(json.load(open(p))["at"])
                  if datetime.now(timezone.utc) - at < timedelta(hours=2):
                      status = "cached"
              except Exception:
                  pass
          # rate limits (shared RPC quota). not label based: outsiders can't set labels.
          # Issue and relay requests share one daily total; a count that cannot be read refuses.
          now = datetime.now(timezone.utc)
          since = (now - timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ")
          hdrs = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=hdrs), timeout=20))
          def issues(query):
              out = []
              for page in (1, 2, 3):
                  batch = get(f"https://api.github.com/repos/{os.environ['REPO']}/issues?{query}&state=all&since={since}&per_page=100&page={page}")
                  out += [i for i in batch if "pull_request" not in i and i["created_at"] >= since]
                  if len(batch) < 100:
                      break
              return out
          def trace_issues():
              return sum(1 for i in issues("sort=created")
                         if i["title"].startswith("[trace]") or "### Token mint address" in (i.get("body") or ""))
          def relay_runs():
              # every page: cancelled runs are listed too, and would push counted ones off page 1
              seen, total = {}, 0
              for page in range(1, 11):
                  d = get(f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/trace.yml/runs"
                          f"?event=workflow_dispatch&per_page=100&page={page}&created=%3E%3D{since}")
                  total = max(total, int(d.get("total_count") or 0))
                  seen.update((r["id"], r) for r in d["workflow_runs"])
                  if len(d["workflow_runs"]) < 100:
                      break
              if len(seen) < total:
                  raise RuntimeError("more runs than were read")
              # cancelled runs traced nothing
              return [r for r in seen.values() if str(r.get("display_title", "")).startswith("trace ")
                      and r.get("conclusion") != "cancelled"]
          if status == "ok" and os.environ.get("ISSUE_TITLE"):
              # all trace issues (this one included) and relay traces in the last 24h
              try:
                  if trace_issues() + len(relay_runs()) > int(os.environ["DAILY_LIMIT"]):
                      status = "limit"
              except Exception as err:
                  print("daily check failed, refusing:", type(err).__name__)
                  status = "limit"
              # this account's issues in the last 24h
              try:
                  author = urllib.parse.quote(os.environ.get("AUTHOR", ""))
                  if len(issues(f"creator={author}")) > int(os.environ["PER_USER_LIMIT"]):
                      status = "limit"
              except Exception as err:
                  print("per-user check failed, refusing:", type(err).__name__)
                  status = "limit"
          # relay requests: the relay applies the limits; this is the backstop if it is raced. Only
          # runs created before this one count (ids rise with creation), as in the relay's re-count.
          if status == "ok" and os.environ.get("REQUESTER"):
              try:
                  own = int(os.environ["RUN_ID"])
                  before = [r for r in relay_runs() if int(r["id"]) < own]
                  # a failed trace (our side) does not use up the visitor's own three
                  mine = [r for r in before if r.get("conclusion") != "failure"
                          and str(r["display_title"]).endswith(" " + os.environ["REQUESTER"])]
                  def active(r):
                      at = datetime.fromisoformat(str(r["created_at"]).replace("Z", "+00:00"))
                      return r.get("status") != "completed" and now - at < timedelta(minutes=30)
                  if len(before) + trace_issues() >= int(os.environ["DAILY_LIMIT"]) or len(mine) >= int(os.environ["PER_USER_LIMIT"]):
                      status = "limit"
                  elif sum(1 for r in before if active(r)) >= int(os.environ["MAX_ACTIVE"]):
                      status = "busy"
              except Exception as err:
                  print("relay daily check failed, refusing:", type(err).__name__)
                  status = "limit"
          # a refused relay run tells the page why (the relay reads this annotation back); it ends
          # as failed, so it does not use up one of the visitor's three
          texts = {"limit": "The free daily limit is reached (3 traces a day per visitor, 40 in total). Please try again tomorrow.",
                   "busy": "Other traces are running right now. Please try again in a few minutes.",
                   "cached": "This token was traced less than 2 hours ago."}
          if os.environ.get("REQUESTER") and status in texts:
              print(f"::notice title=reply::{texts[status]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"mint={mint}\nstatus={status}\n")
          print("request:", status, mint)
          if os.environ.get("REQUESTER") and status in ("limit", "busy"):
              raise SystemExit(1)
          PY

      - name: Checkout the private trading code
        if: steps.req.outputs.status == 'ok'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: src
          persist-credentials: false

      - name: Trace
        id: trace
        if: steps.req.outputs.status == 'ok'
        working-directory: src/memecoin-trading
        env:
          TRACE_MINT: ${{ steps.req.outputs.mint }}
          KNOWN_PUBLIC_FILE: ${{ github.workspace }}/site/radar-known.json
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set +e
          python3 scripts/trace_token.py "$RUNNER_TEMP/trace.json" "$RUNNER_TEMP/reply.md"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # the reason a trace failed, as a run annotation the site relay reads back
          if [ "$code" != "0" ] && [ -s "$RUNNER_TEMP/reply.md" ]; then
            echo "::notice title=reply::$(python3 -c 'import os; t=open(os.environ["RUNNER_TEMP"]+"/reply.md").read(); print(t.replace("%","%25").replace("\r","").replace("\n","%0A"))')"
          fi
          # a trace that failed on our side (the RPC node did not answer, a crash) ends the run as
          # failed, so the relay does not count it against the visitor; a refused address (a wallet,
          # a stablecoin, not on Solana) still counts. The reply is posted either way.
          if [ "$code" != "0" ] && { [ "$code" != "2" ] || [ ! -s "$RUNNER_TEMP/reply.md" ] || grep -qi "try again later" "$RUNNER_TEMP/reply.md"; }; then
            exit 1
          fi

      - name: Save the result to the radar
        if: steps.req.outputs.status == 'ok' && steps.trace.outputs.code == '0'
        env:
          MINT: ${{ steps.req.outputs.mint }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/trace.json" "site/radar-requests/${MINT}.json"
          cd site
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "radar-requests/${MINT}.json"
          git commit --quiet -m "Radar trace ${MINT:0:8}"
          bash scripts/push-snapshot.sh 4 || echo "::warning::could not save the trace; the reply is still posted"

      - name: Reply on the issue
        if: always() && (github.event_name == 'issues' || github.event.inputs.issue != '')
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.inputs.issue }}
          STATUS: ${{ steps.req.outputs.status }}
          MINT: ${{ steps.req.outputs.mint }}
          CODE: ${{ steps.trace.outputs.code }}
        run: |
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || { echo "not an issue number"; exit 0; }
          case "$STATUS" in
            ok)      [ -s "$RUNNER_TEMP/reply.md" ] || echo "The trace failed unexpectedly. Please try again later." > "$RUNNER_TEMP/reply.md" ;;
            cached)  printf 'This token was traced less than 2 hours ago. See it on the [Insider Radar](https://bernardhaddad.github.io/sift/radar.html#%s).\n' "$MINT" > "$RUNNER_TEMP/reply.md" ;;
            limit)   echo "The free daily trace limit is reached (3 requests a day per account, 40 traces a day in total). Please try again tomorrow." > "$RUNNER_TEMP/reply.md" ;;
            *)       echo "No Solana token address found. Open a new request and paste the token's mint address (32 to 44 characters)." > "$RUNNER_TEMP/reply.md" ;;
          esac
          if [ "$STATUS" = "ok" ] && [ "$CODE" = "0" ] && [ -n "$MINT" ]; then
            printf '\n\nOn the radar: https://bernardhaddad.github.io/sift/radar.html#%s (after the next hourly update)\n' "$MINT" >> "$RUNNER_TEMP/reply.md"
          fi
          printf '\n\n---\n_Automated reply by Sift Insider Radar._\n' >> "$RUNNER_TEMP/reply.md"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
            -d "$(python3 -c 'import json,os,sys; print(json.dumps({"body": open(os.environ["RUNNER_TEMP"]+"/reply.md").read()}))')" -o /dev/null -w "comment %{http_code}\n"
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${NUMBER}" -d '{"state":"closed","state_reason":"completed"}' -o /dev/null -w "close %{http_code}\n"
