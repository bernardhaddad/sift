name: insider radar trace

# Answers "[trace] <mint>" issues (the Trace a token issue form) with a funding-cluster trace of
# the token's top holders, using the private trading code (scripts/trace_token.py) and the same
# Helius secret as the hourly cycle. The result is posted on the issue, saved to radar-requests/
# and shown on radar.html. workflow_dispatch runs the same trace without an issue (testing).
#
# Untrusted input: the issue title and body reach the job only through environment variables and
# are parsed in Python; the mint is validated as base58 before anything uses it. Nothing from the
# issue is ever interpolated into a shell command.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mint:
        description: Token mint address
        required: true
      issue:
        description: Issue number to answer (optional, for re-running a missed request)
        required: false

permissions:
  contents: write
  issues: write

# One group per request: a shared group keeps only one pending run and silently cancels the rest.
# Parallel saves are handled by the push retry below; volume is capped by the limits.
concurrency:
  group: radar-trace-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  SOURCE_REF: cc2020bb7cf96592d84e24d5710d239da41af3ee  # the exact commit of the trading code that runs here
  DAILY_LIMIT: "40"      # fresh traces a day, all requesters together
  PER_USER_LIMIT: "3"    # requests a day per GitHub account

jobs:
  trace:
    # The request form's body always carries its "Token mint address" heading, so a request is
    # recognised even when the requester rewrites the "[trace]" title.
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[trace]') ||
      contains(github.event.issue.body, '### Token mint address')
    runs-on: ubuntu-24.04  # pinned like the other jobs; they use the image python3
    timeout-minutes: 10
    steps:
      - name: Checkout this site repository
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: false  # the token is used only by the save step, not the trace

      - name: Read the request
        id: req
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_MINT: ${{ github.event.inputs.mint }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          rx = re.compile(r"(?<![1-9A-HJ-NP-Za-km-z])[1-9A-HJ-NP-Za-km-z]{32,44}(?![1-9A-HJ-NP-Za-km-z])")
          text = "\n".join(os.environ.get(k, "") for k in ("INPUT_MINT", "ISSUE_TITLE", "ISSUE_BODY"))
          m = rx.search(text)
          mint = m.group(0) if m else ""
          status = "ok" if mint else "invalid"
          # cached: a trace of this mint in the last 2 hours is reused
          p = f"site/radar-requests/{mint}.json"
          if mint and os.path.exists(p):
              try:
                  at = datetime.fromisoformat(json.load(open(p))["at"])
                  if datetime.now(timezone.utc) - at < timedelta(hours=2):
                      status = "cached"
              except Exception:
                  pass
          # Limits protect the RPC quota the hourly cycle shares; both fail closed. Labels are not
          # used: GitHub drops labels set by non-collaborators, so they can be dodged.
          if status == "ok" and os.environ.get("ISSUE_TITLE"):
              now = datetime.now(timezone.utc)
              since = (now - timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ")
              api = f"https://api.github.com/repos/{os.environ['REPO']}/issues"
              hdrs = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
              def issues(query):
                  out = []
                  for page in (1, 2, 3):
                      req = urllib.request.Request(f"{api}?{query}&state=all&since={since}&per_page=100&page={page}", headers=hdrs)
                      batch = json.load(urllib.request.urlopen(req, timeout=20))
                      out += [i for i in batch if "pull_request" not in i and i["created_at"] >= since]
                      if len(batch) < 100:
                          break
                  return out
              # all requesters: trace requests opened in the last 24 hours, including ones still
              # running (saved files would miss a burst of simultaneous requests)
              try:
                  n = sum(1 for i in issues("sort=created")
                          if i["title"].startswith("[trace]") or "### Token mint address" in (i.get("body") or ""))
                  if n > int(os.environ["DAILY_LIMIT"]):
                      status = "limit"
              except Exception as err:
                  print("daily check failed, refusing:", type(err).__name__)
                  status = "limit"
              # per requester: issues this account opened in the last 24 hours (any title or label)
              try:
                  author = urllib.parse.quote(os.environ.get("AUTHOR", ""))
                  if len(issues(f"creator={author}")) > int(os.environ["PER_USER_LIMIT"]):
                      status = "limit"
              except Exception as err:
                  print("per-user check failed, refusing:", type(err).__name__)
                  status = "limit"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"mint={mint}\nstatus={status}\n")
          print("request:", status, mint)
          PY

      - name: Checkout the private trading code
        if: steps.req.outputs.status == 'ok'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: src
          persist-credentials: false

      - name: Trace
        id: trace
        if: steps.req.outputs.status == 'ok'
        working-directory: src/memecoin-trading
        env:
          TRACE_MINT: ${{ steps.req.outputs.mint }}
          KNOWN_PUBLIC_FILE: ${{ github.workspace }}/site/radar-known.json  # same infrastructure list as the hourly cycle
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set +e
          python3 scripts/trace_token.py "$RUNNER_TEMP/trace.json" "$RUNNER_TEMP/reply.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Save the result to the radar
        if: steps.req.outputs.status == 'ok' && steps.trace.outputs.code == '0'
        env:
          MINT: ${{ steps.req.outputs.mint }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/trace.json" "site/radar-requests/${MINT}.json"
          cd site
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "radar-requests/${MINT}.json"
          git commit --quiet -m "Radar trace ${MINT:0:8}"
          for attempt in 1 2 3 4; do
            if git push --quiet origin HEAD:main; then echo "saved"; exit 0; fi
            git pull --quiet --rebase -X theirs origin main || git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::warning::could not save the trace; the reply is still posted"

      - name: Reply on the issue
        if: always() && (github.event_name == 'issues' || github.event.inputs.issue != '')
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.inputs.issue }}
          STATUS: ${{ steps.req.outputs.status }}
          MINT: ${{ steps.req.outputs.mint }}
          CODE: ${{ steps.trace.outputs.code }}
        run: |
          case "$STATUS" in
            ok)      [ -s "$RUNNER_TEMP/reply.md" ] || echo "The trace failed unexpectedly. Please try again later." > "$RUNNER_TEMP/reply.md" ;;
            cached)  printf 'This token was traced less than 2 hours ago. See it on the [Insider Radar](https://bernardhaddad.github.io/sift/radar.html#%s).\n' "$MINT" > "$RUNNER_TEMP/reply.md" ;;
            limit)   echo "The free daily trace limit is reached (3 requests a day per account, 40 traces a day in total). Please try again tomorrow." > "$RUNNER_TEMP/reply.md" ;;
            *)       echo "No Solana token address found. Open a new request and paste the token's mint address (32 to 44 characters)." > "$RUNNER_TEMP/reply.md" ;;
          esac
          if [ "$STATUS" = "ok" ] && [ "$CODE" = "0" ] && [ -n "$MINT" ]; then
            printf '\n\nOn the radar: https://bernardhaddad.github.io/sift/radar.html#%s (after the next hourly update)\n' "$MINT" >> "$RUNNER_TEMP/reply.md"
          fi
          printf '\n\n---\n_Automated reply by Sift Insider Radar._\n' >> "$RUNNER_TEMP/reply.md"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
            -d "$(python3 -c 'import json,os,sys; print(json.dumps({"body": open(os.environ["RUNNER_TEMP"]+"/reply.md").read()}))')" -o /dev/null -w "comment %{http_code}\n"
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${NUMBER}" -d '{"state":"closed","state_reason":"completed"}' -o /dev/null -w "close %{http_code}\n"
