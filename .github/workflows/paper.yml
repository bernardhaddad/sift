name: memecoin paper-trading cycle (public host)

# hourly paper cycle + site build. runs here (public repo = free Actions minutes),
# reads the private code with a read-only token. book state lives in the Actions
# cache under paper-state/, seeded from paper-seed/ if missing.
#
# secrets: SOURCE_REPO, SOURCE_READ_TOKEN (contents:read on that repo only),
# HELIUS_API_KEY; optional TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SOLANA_RPC_URL

on:
  schedule:
    - cron: "47 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # watchdog dispatches scanner.yml

concurrency:
  # renamed after a run got stuck in 'queued' and held the old group
  group: memecoin-paper-2
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  SOURCE_REF: 4bf50208e95214dfaa9d6d4370fe6b9b245a5b93  # private code commit

jobs:
  cycle:
    runs-on: ubuntu-24.04  # pinned, uses the image's python3
    timeout-minutes: 25
    steps:
      - name: Check the read token is present
        env:
          T: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$T" ] || [ -z "$SOURCE_REPO" ]; then
            echo "::error::SOURCE_READ_TOKEN or SOURCE_REPO is not set. Add the private repository's owner/name as SOURCE_REPO and a fine-grained PAT with Contents: Read on it as SOURCE_READ_TOKEN."
            exit 1
          fi

      - name: Checkout this site repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout the private trading code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: src

      # book state: unique save key, prefix restore picks the newest
      - name: Restore paper state
        uses: actions/cache@v4
        with:
          path: paper-state
          key: memecoin-book-${{ github.run_id }}
          restore-keys: |
            memecoin-book-

      - name: Seed the book on first run, then install it over the repo stub
        run: |
          mkdir -p paper-state
          if [ ! -f paper-state/state.json ]; then
            echo "no cached book: seeding paper-state/ from paper-seed/ (rebuilt from the published snapshot, seq 198)"
            cp site/paper-seed/state.json site/paper-seed/cycle_meta.json site/paper-seed/flow_log.jsonl paper-state/
          else
            echo "cached book restored"
          fi
          rm -rf src/memecoin-trading/data
          cp -r paper-state src/memecoin-trading/data
          python3 - <<'PY'
          import json
          s = json.load(open("src/memecoin-trading/data/state.json"))["experiments"]
          print("book installed:", {k: (len(v.get("closed", [])), len(v.get("open", {}))) for k, v in s.items()})
          PY

      - name: Run cycle
        working-directory: src/memecoin-trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          # trace the scanner's candidates too
          SCANNER_SNAPSHOT: ${{ github.workspace }}/site/fast.json
        run: python3 scripts/run.py cycle

      # live tranche, off unless LIVE_ENABLED=1
      - name: Live tranche (gated)
        if: always()
        continue-on-error: true
        working-directory: src/memecoin-trading
        env:
          LIVE_ENABLED: ${{ secrets.LIVE_ENABLED }}
          LIVE_BOOK: ${{ secrets.LIVE_BOOK }}
          LIVE_WALLET_SECRET: ${{ secrets.LIVE_WALLET_SECRET }}
          LIVE_DRY_RUN: ${{ secrets.LIVE_DRY_RUN }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$LIVE_ENABLED" = "1" ] || [ -f data/live_state.json ]; then
            python3 -m pip install --quiet solders
          fi
          python3 scripts/live.py

      - name: Save the book back to the cached path
        if: always()
        run: |
          rm -rf paper-state
          cp -r src/memecoin-trading/data paper-state

      # continue-on-error: a failed publish must not skip the cache save
      - name: Build and publish the site
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          # pillow is only for the preview cards
          python3 -m pip install --quiet pillow || echo "pillow not installed: no preview cards"
          (cd src/memecoin-trading && python3 scripts/build_site.py)
          (cd src/memecoin-trading && python3 scripts/build_research.py) || echo "research page not built"
          cp src/memecoin-trading/site/index.html src/memecoin-trading/site/config.js \
             src/memecoin-trading/site/data.json site/
          [ -f src/memecoin-trading/site/research.html ] && cp src/memecoin-trading/site/research.html site/ || true
          for f in 404.html privacy.html terms.html sitemap.xml og.png; do
            [ -f "src/memecoin-trading/site/$f" ] && cp "src/memecoin-trading/site/$f" site/ || true
          done
          # radar: trending feed, audit, build (all best effort)
          (cd src/memecoin-trading && timeout 480 python3 scripts/radar_feed.py "$GITHUB_WORKSPACE/site/radar-auto" "$GITHUB_WORKSPACE/site/radar-requests") || echo "radar feed skipped"
          (cd src/memecoin-trading && timeout 240 python3 scripts/radar_audit.py "$GITHUB_WORKSPACE/site/radar.json" "$GITHUB_WORKSPACE/site/radar-audit.json") || echo "radar audit skipped"
          (cd src/memecoin-trading && python3 scripts/build_radar.py "$GITHUB_WORKSPACE/site/radar-requests,$GITHUB_WORKSPACE/site/radar-auto" "$GITHUB_WORKSPACE/site/radar-ledger.json" "$GITHUB_WORKSPACE/site/radar-wallets.json" "$GITHUB_WORKSPACE/site/radar-audit.json" "$GITHUB_WORKSPACE/site/radar-lp.json") || echo "radar not built"
          [ -d src/memecoin-trading/site/t ] && rm -rf site/t && cp -r src/memecoin-trading/site/t site/ || true
          [ -f src/memecoin-trading/site/radar.json ] && cp src/memecoin-trading/site/radar.html src/memecoin-trading/site/radar.json src/memecoin-trading/site/radar-known.json src/memecoin-trading/site/radar-ledger.json src/memecoin-trading/site/radar-wallets.json src/memecoin-trading/site/radar-feed.xml src/memecoin-trading/site/radar-lp.json site/ || true
          [ -f src/memecoin-trading/data/cluster_verdicts.json ] && cp src/memecoin-trading/data/cluster_verdicts.json site/ || true
          touch site/.nojekyll
          bash site/scripts/anchor.sh site || true  # daily OpenTimestamps proof of the track record
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "site unchanged"; exit 0; fi
          git commit --quiet -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then echo "published"; exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch --quiet origin main
            if ! git rebase --quiet -X theirs origin/main; then
              git rebase --abort || true
              git reset --quiet --hard origin/main
              echo "rebase failed; site left at origin/main, book unaffected"
              exit 0
            fi
            sleep 5
          done
          echo "site not published after 3 attempts; book unaffected"

      # restart the scanner if nothing is running or queued
      - name: Scanner watchdog
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/runs?per_page=5")
          alive=$(printf '%s' "$runs" | python3 -c '
          import json, sys
          try:
              runs = json.load(sys.stdin)["workflow_runs"]
          except Exception:
              print("unknown"); raise SystemExit
          print("alive" if any(r["status"] in ("queued", "in_progress", "waiting", "pending") for r in runs) else "dead")
          ')
          echo "scanner watchdog: $alive"
          if [ "$alive" = "dead" ]; then
            curl -sS -m 20 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w "scanner watchdog: dispatched (http %{http_code})\n"
          fi

      - name: Upload data logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: paper-data-${{ github.run_id }}
          path: paper-state
          retention-days: 7
