name: memecoin paper-trading cycle (public host)

# Relocated here from bernardhaddad/ClaudeAI on 2026-09-16.
#
# Why: the account is on GitHub Free, whose 2,000 included Actions minutes per
# month are consumed by jobs in PRIVATE repositories. They ran out on 09-16 and
# every scheduled paper cycle was refused ("spending limit needs to be
# increased") until the reset. Public repositories are not metered, and this
# repository is public because GitHub Pages serves the Sift screener from it.
# So the cycle runs here, reading the private trading code through a read-only
# token, and publishes the site in the same job (no deploy token needed).
#
# State: the book lives in this repository's Actions cache (cache-as-state),
# held OUTSIDE the source checkout in paper-state/. The private repository
# ships a stub memecoin-trading/data/ (an empty August state), and the first
# version of this workflow restored the cache straight into that directory,
# saw the stub, skipped seeding and ran a cycle on an empty book (run
# 35104735505). The cache key prefix changed at the same time so that run can
# never be restored. When paper-state/ has no state.json the job seeds it from
# paper-seed/, rebuilt from the last snapshot the private host published
# (seq 198, 2026-09-16 00:48 UTC, M2 at 57 closed and no open positions).
#
# Secrets this repository needs (Settings -> Secrets and variables -> Actions):
#   CLAUDEAI_READ_TOKEN  fine-grained PAT, repository access = ClaudeAI only,
#                        permission Contents = Read. Nothing else.
#   HELIUS_API_KEY       the Amendment 6 funding-cluster gate; without it the
#                        gate fails closed and no new M2 trades open.
#   TELEGRAM_BOT_TOKEN   optional phone alerts.
#   TELEGRAM_CHAT_ID     optional phone alerts.
#   SOLANA_RPC_URL       optional override; leave unset to use Helius.

on:
  schedule:
    - cron: "47 * * * *" # minute changed 2026-09-16 16:05 UTC to re-register a schedule that never fired
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # the scanner watchdog step dispatches scanner.yml

concurrency:
  group: memecoin-paper
  cancel-in-progress: false

env:
  SOURCE_REPO: bernardhaddad/ClaudeAI
  SOURCE_REF: claude/dreamy-curie-3UNnv

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the read token is present
        env:
          T: ${{ secrets.CLAUDEAI_READ_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::CLAUDEAI_READ_TOKEN is not set. Add a fine-grained PAT with Contents: Read on ${SOURCE_REPO} as a secret of this repository."
            exit 1
          fi

      - name: Checkout this site repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout the private trading code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.CLAUDEAI_READ_TOKEN }}
          path: src

      # Cache-as-state, outside the checkout: unique save key, prefix restore
      # keeps the newest state. The prefix is "memecoin-book-" (not the earlier
      # "memecoin-paper-state-") so the empty-book run can never be restored.
      - name: Restore paper state
        uses: actions/cache@v4
        with:
          path: paper-state
          key: memecoin-book-${{ github.run_id }}
          restore-keys: |
            memecoin-book-

      - name: Seed the book on first run, then install it over the repo stub
        run: |
          mkdir -p paper-state
          if [ ! -f paper-state/state.json ]; then
            echo "no cached book: seeding paper-state/ from paper-seed/ (rebuilt from the published snapshot, seq 198)"
            cp site/paper-seed/state.json site/paper-seed/cycle_meta.json site/paper-seed/flow_log.jsonl paper-state/
          else
            echo "cached book restored"
          fi
          rm -rf src/memecoin-trading/data
          cp -r paper-state src/memecoin-trading/data
          python3 - <<'PY'
          import json
          s = json.load(open("src/memecoin-trading/data/state.json"))["experiments"]
          print("book installed:", {k: (len(v.get("closed", [])), len(v.get("open", {}))) for k, v in s.items()})
          PY

      - name: Run cycle
        working-directory: src/memecoin-trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python3 scripts/run.py cycle

      # §12 live tranche (docs/live.md in the private repository). Fails closed:
      # without LIVE_ENABLED=1, a LIVE_BOOK at PROMOTE-TO-REVIEW and the wallet
      # secret it prints one "off" line and exits 0. State lives in data/ with the
      # paper book and is published with the site as the public record.
      - name: Live tranche (gated)
        if: always()
        continue-on-error: true
        working-directory: src/memecoin-trading
        env:
          LIVE_ENABLED: ${{ secrets.LIVE_ENABLED }}
          LIVE_BOOK: ${{ secrets.LIVE_BOOK }}
          LIVE_WALLET_SECRET: ${{ secrets.LIVE_WALLET_SECRET }}
          LIVE_DRY_RUN: ${{ secrets.LIVE_DRY_RUN }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$LIVE_ENABLED" = "1" ] || [ -f data/live_state.json ]; then
            python3 -m pip install --quiet solders
          fi
          python3 scripts/live.py

      - name: Save the book back to the cached path
        if: always()
        run: |
          rm -rf paper-state
          cp -r src/memecoin-trading/data paper-state

      # continue-on-error: a failed step fails the job, and a failed job skips
      # the cache save, which would drop the cycle that just ran (seen 2026-09-18
      # 05:56 UTC when a scheduled run and a manual dispatch overlapped and the
      # second push was rejected). Publishing must never be able to lose the book.
      # On a rejected push the snapshot is rebased onto origin/main; the site files
      # are regenerated whole each cycle, so the replayed commit ("theirs" under
      # rebase) is always the right side of any conflict.
      - name: Build and publish the site
        continue-on-error: true
        run: |
          (cd src/memecoin-trading && python3 scripts/build_site.py)
          # The research page is built from the private repository's docs; a build
          # failure there must not block the snapshot, so it is best-effort.
          (cd src/memecoin-trading && python3 scripts/build_research.py) || echo "research page not built"
          cp src/memecoin-trading/site/index.html src/memecoin-trading/site/config.js \
             src/memecoin-trading/site/data.json site/
          [ -f src/memecoin-trading/site/research.html ] && cp src/memecoin-trading/site/research.html site/ || true
          touch site/.nojekyll
          cd site
          git config user.name "sift-bot"
          git config user.email "sift-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "site unchanged"; exit 0; fi
          git commit --quiet -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then echo "published"; exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch --quiet origin main
            if ! git rebase --quiet -X theirs origin/main; then
              git rebase --abort || true
              git reset --quiet --hard origin/main
              echo "rebase failed; site left at origin/main, book unaffected"
              exit 0
            fi
            sleep 5
          done
          echo "site not published after 3 attempts; book unaffected"

      # The minute scanner (scanner.yml) watches this cycle; this cycle watches the
      # scanner back. If no scanner run is in progress or queued, one is dispatched.
      # scanner.yml's concurrency group makes a duplicate harmless.
      - name: Scanner watchdog
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/runs?per_page=5")
          alive=$(printf '%s' "$runs" | python3 -c '
          import json, sys
          try:
              runs = json.load(sys.stdin)["workflow_runs"]
          except Exception:
              print("unknown"); raise SystemExit
          print("alive" if any(r["status"] in ("queued", "in_progress", "waiting", "pending") for r in runs) else "dead")
          ')
          echo "scanner watchdog: $alive"
          if [ "$alive" = "dead" ]; then
            curl -sS -m 20 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w "scanner watchdog: dispatched (http %{http_code})\n"
          fi

      # Public-repository artifacts are not metered: the raw panel is retrievable
      # again for the mining passes.
      - name: Upload data logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: paper-data-${{ github.run_id }}
          path: paper-state
          retention-days: 7
