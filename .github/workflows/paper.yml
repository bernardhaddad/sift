name: memecoin paper-trading cycle (public host)

# hourly paper cycle + site build. runs here (public repo = free Actions minutes),
# reads the private code with a read-only token. book state lives in the Actions
# cache under paper-state/; a missing cache skips the cycle (dispatch with seed=yes to start over).
#
# secrets: SOURCE_REPO, SOURCE_READ_TOKEN (contents:read on that repo only),
# HELIUS_API_KEY; optional TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SOLANA_RPC_URL

on:
  schedule:
    - cron: "47 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Start the paper book over from paper-seed/ if no cached book is found (yes/no)
        required: false
        default: "no"

permissions:
  contents: write
  actions: write # watchdog dispatches scanner.yml

concurrency:
  # renamed after a run got stuck in 'queued' and held the old group
  group: memecoin-paper-2
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  SOURCE_REF: 79c7e3717f0d2b132d46d424f5af2f189327ca48  # private code commit

jobs:
  cycle:
    runs-on: ubuntu-24.04  # pinned, uses the image's python3
    timeout-minutes: 25
    steps:
      - name: Check the read token is present
        env:
          T: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$T" ] || [ -z "$SOURCE_REPO" ]; then
            echo "::error::SOURCE_READ_TOKEN or SOURCE_REPO is not set. Add the private repository's owner/name as SOURCE_REPO and a fine-grained PAT with Contents: Read on it as SOURCE_READ_TOKEN."
            exit 1
          fi

      # ref: main, not the commit that triggered the run: a run that waited behind another one must
      # start from the newest published ledger, or it would publish an older copy over it
      - name: Checkout this site repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout the private trading code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: src

      # book state: unique save key, prefix restore picks the newest. Restore and save are separate
      # steps so a run without a book never saves one (an empty save would hide the real book)
      - name: Restore paper state
        uses: actions/cache/restore@v4
        with:
          path: paper-state
          key: memecoin-book-${{ github.run_id }}
          restore-keys: |
            memecoin-book-

      # The book lives in the Actions cache, and every finished cycle also publishes it to
      # paper-seed/ in the same commit as data.json. A failed cache save is only a warning, so the
      # restore can bring back the run-before-last's book: a book behind the published record would
      # reopen closed trades and could revive a killed book. So the cycle runs on the cached book
      # when it is readable and current, else on the published one; if neither is, the cycle, the
      # live tranche and the cache save are skipped and the screener data stays as published.
      - name: Install the book (cache, else the published book)
        id: book
        env:
          SEED: ${{ github.event.inputs.seed }}
        run: |
          mkdir -p paper-state
          if python3 site/scripts/book-check.py paper-state site/data.json; then
            echo "cached book restored"
          elif python3 site/scripts/book-check.py site/paper-seed site/data.json || [ "$SEED" = "yes" ]; then
            echo "::warning::the cached book is missing, unreadable or behind the published record; the cycle runs on the published book in paper-seed/"
            cp site/paper-seed/state.json site/paper-seed/cycle_meta.json site/paper-seed/flow_log.jsonl paper-state/
          else
            echo "::error::neither the cached nor the published book is usable; the trading cycle is skipped this run"
            echo "book=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "book=ok" >> "$GITHUB_OUTPUT"
          rm -rf src/memecoin-trading/data
          cp -r paper-state src/memecoin-trading/data
          python3 - <<'PY'
          import json
          s = json.load(open("src/memecoin-trading/data/state.json"))["experiments"]
          print("book installed:", {k: (len(v.get("closed", [])), len(v.get("open", {}))) for k, v in s.items()})
          PY

      - name: Run cycle
        id: cycle
        if: steps.book.outputs.book == 'ok'
        working-directory: src/memecoin-trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          # trace the scanner's candidates too
          SCANNER_SNAPSHOT: ${{ github.workspace }}/site/fast.json
          # the published record run.py refuses to fall behind (its default path, stated here)
          PUBLISHED_DATA: ${{ github.workspace }}/site/data.json
        run: python3 scripts/run.py cycle

      # live tranche, off unless LIVE_ENABLED=1
      - name: Live tranche (gated)
        if: always() && steps.book.outputs.book == 'ok'
        continue-on-error: true
        working-directory: src/memecoin-trading
        env:
          LIVE_ENABLED: ${{ secrets.LIVE_ENABLED }}
          LIVE_BOOK: ${{ secrets.LIVE_BOOK }}
          LIVE_WALLET_SECRET: ${{ secrets.LIVE_WALLET_SECRET }}
          LIVE_DRY_RUN: ${{ secrets.LIVE_DRY_RUN }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$LIVE_ENABLED" = "1" ] || [ -f data/live_state.json ]; then
            python3 -m pip install --quiet solders
          fi
          python3 scripts/live.py

      - name: Save the book back to the cached path
        if: always() && steps.book.outputs.book == 'ok'
        run: |
          rm -rf paper-state
          cp -r src/memecoin-trading/data paper-state

      - name: Save paper state
        if: always() && steps.book.outputs.book == 'ok'
        uses: actions/cache/save@v4
        with:
          path: paper-state
          key: memecoin-book-${{ github.run_id }}

      # always: the radar and its track record are sampled every hour even when the trading cycle
      # failed (6 hours without a sample would void every open entry); the screener's data.json is
      # only rebuilt from a book that finished its cycle
      - name: Build and publish the site
        if: always()
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          CYCLE: ${{ steps.cycle.outcome }}
        run: |
          # pillow is only for the preview cards
          python3 -m pip install --quiet pillow || echo "pillow not installed: no preview cards"
          # best effort like the rest: a build_site failure must not stop the radar sample below
          if [ "$CYCLE" = "success" ]; then
            if (cd src/memecoin-trading && python3 scripts/build_site.py); then
              cp src/memecoin-trading/site/index.html src/memecoin-trading/site/config.js \
                 src/memecoin-trading/site/data.json site/ || echo "::warning::screener files not copied"
              # the book behind this data.json, published with it: the fallback when the cache is behind
              cp src/memecoin-trading/data/state.json src/memecoin-trading/data/cycle_meta.json \
                 src/memecoin-trading/data/flow_log.jsonl site/paper-seed/ || echo "::warning::book not published to paper-seed/"
            else
              echo "::warning::screener not rebuilt (build_site failed): screener data left as published"
            fi
          else
            echo "trading cycle did not finish ($CYCLE): screener data left as published"
          fi
          (cd src/memecoin-trading && python3 scripts/build_research.py) || echo "research page not built"
          [ -f src/memecoin-trading/site/research.html ] && cp src/memecoin-trading/site/research.html site/ || true
          for f in 404.html privacy.html terms.html sitemap.xml og.png radar-review.json sift.css; do
            [ -f "src/memecoin-trading/site/$f" ] && cp "src/memecoin-trading/site/$f" site/ || true
          done
          # radar: trending feed, audit, build (all best effort)
          (cd src/memecoin-trading && timeout 480 python3 scripts/radar_feed.py "$GITHUB_WORKSPACE/site/radar-auto" "$GITHUB_WORKSPACE/site/radar-requests") || echo "radar feed skipped"
          (cd src/memecoin-trading && timeout 240 python3 scripts/radar_audit.py --audit "$GITHUB_WORKSPACE/site/radar.json" "$GITHUB_WORKSPACE/site/radar-audit.json") || echo "radar audit skipped"
          (cd src/memecoin-trading && python3 scripts/build_radar.py "$GITHUB_WORKSPACE/site/radar-requests,$GITHUB_WORKSPACE/site/radar-auto" "$GITHUB_WORKSPACE/site/radar-ledger.json" "$GITHUB_WORKSPACE/site/radar-wallets.json" "$GITHUB_WORKSPACE/site/radar-audit.json" "$GITHUB_WORKSPACE/site/radar-lp.json") || echo "radar not built"
          [ -d src/memecoin-trading/site/fonts ] && rm -rf site/fonts && cp -r src/memecoin-trading/site/fonts site/ || true
          [ -f src/memecoin-trading/scripts/radar_audit.py ] && cp src/memecoin-trading/scripts/radar_audit.py site/verify.py || true
          [ -d src/memecoin-trading/site/t ] && rm -rf site/t && cp -r src/memecoin-trading/site/t site/ || true
          [ -f src/memecoin-trading/site/radar.json ] && cp src/memecoin-trading/site/radar.html src/memecoin-trading/site/radar.json src/memecoin-trading/site/radar-known.json src/memecoin-trading/site/radar-ledger.json src/memecoin-trading/site/radar-wallets.json src/memecoin-trading/site/radar-feed.xml src/memecoin-trading/site/radar-lp.json site/ || true
          [ -f src/memecoin-trading/data/cluster_verdicts.json ] && cp src/memecoin-trading/data/cluster_verdicts.json site/ || true
          touch site/.nojekyll
          bash site/scripts/anchor.sh site || true  # daily OpenTimestamps proof of the track record
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "site unchanged"; exit 0; fi
          git commit --quiet -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          bash scripts/push-snapshot.sh 4 || echo "site not published; book unaffected"

      # restart the scanner if nothing is running or queued
      - name: Scanner watchdog
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/runs?per_page=5")
          alive=$(printf '%s' "$runs" | python3 -c '
          import json, sys
          try:
              runs = json.load(sys.stdin)["workflow_runs"]
          except Exception:
              print("unknown"); raise SystemExit
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          def age(r):
              return (now - datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))).total_seconds()
          # a run left queued for over 30 minutes is stuck, not alive
          print("alive" if any(r["status"] == "in_progress" or (r["status"] in ("queued", "waiting", "pending") and age(r) < 1800)
                               for r in runs) else "dead")
          ')
          echo "scanner watchdog: $alive"
          if [ "$alive" = "dead" ]; then
            curl -sS -m 20 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w "scanner watchdog: dispatched (http %{http_code})\n"
          fi

      - name: Upload data logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: paper-data-${{ github.run_id }}
          path: paper-state
          retention-days: 7
